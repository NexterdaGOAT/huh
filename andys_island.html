<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Andy's Island</title>
    <style>
        body {
            margin: 0;
            background: #010402;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #ui {
            position: absolute;
            top: 20px;
            text-align: center;
            z-index: 10;
            pointer-events: none;
        }
        h1 {
            margin: 0 0 5px 0;
            font-size: 1.6rem;
            color: #33ff66;
            letter-spacing: 3px;
            text-shadow: 0 0 8px rgba(0,255,0,0.4);
        }
        #stats {
            font-size: 1rem;
            background: rgba(0,0,0,0.85);
            padding: 6px 20px;
            border: 1px solid #224422;
            border-radius: 4px;
        }
        canvas {
            background: #000;
            box-shadow: 0 0 50px rgba(0,0,0,0.95);
            border: 2px solid #223322;
        }
    </style>
</head>
<body>

<div id="ui">
    <h1>ANDY'S ISLAND</h1>
    <div id="stats">Loading Operations...</div>
</div>

<canvas id="gameCanvas" width="800" height="600"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const MAP_SIZE = 16;
// 1 = Island Jungle Wall, 0 = Open Path, 2 = The Stranded Escape Boat
const islandMapLayout = [
    "1111111111111111",
    "1000000000000001",
    "1011110111011101",
    "1010000101010101",
    "1010111101010101",
    "1010000001000101",
    "1011111101111101",
    "1000000100000001",
    "1111101111101111",
    "1000000000000001",
    "1011111011111101",
    "1010001010000101",
    "1010101010110101",
    "1000100000110001",
    "1111111112111111",
    "1111111111111111"
];

let islandMap = [];
for(let r=0; r<MAP_SIZE; r++) {
    let row = [];
    for(let c=0; c<MAP_SIZE; c++) {
        row.push(parseInt(islandMapLayout[r][c]));
    }
    islandMap.push(row);
}

// Game states: INTRO_CUTSCENE, PLAYING, JUMPSCARE, OUTRO_CUTSCENE
let gameState = 'INTRO_CUTSCENE'; 
let cutsceneTimer = 0;
let cutsceneStage = 0;

let player = {
    x: 1.5, y: 1.5,
    angle: 0.5,
    fov: Math.PI / 3,
    speed: 0.05,
    partsCollected: 0,
    totalParts: 4
};

let andy = {
    x: 13.5, y: 1.5,
    speed: 0.026,
    heightModifier: 1.5,
    widthModifier: 0.4
};

let boatParts = [
    {x: 1.5, y: 13.5, type: 'Propeller', collected: false},
    {x: 14.5, y: 5.5, type: 'Spark Plug', collected: false},
    {x: 6.5, y: 7.5, type: 'Fuel Tank', collected: false},
    {x: 13.5, y: 13.5, type: 'Battery', collected: false}
];

let keys = {};
let depthBuffer = [];

canvas.addEventListener('click', () => {
    if (gameState === 'PLAYING' && !document.pointerLockElement) {
        canvas.requestPointerLock();
    }
});

document.addEventListener('mousemove', (e) => {
    if (document.pointerLockElement === canvas && gameState === 'PLAYING') {
        player.angle += e.movementX * 0.003;
    }
});

window.addEventListener('keydown', e => {
    keys[e.key.toLowerCase()] = true;
    if (e.key === ' ' || e.code === 'Space') {
        if (gameState === 'INTRO_CUTSCENE' && cutsceneStage >= 3) {
            gameState = 'PLAYING';
            canvas.requestPointerLock();
        } else if (gameState === 'JUMPSCARE' && cutsceneTimer > 60) {
            resetGame();
        } else if (gameState === 'OUTRO_CUTSCENE' && cutsceneStage >= 2) {
            resetGame();
        }
    }
});
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

function resetGame() {
    player.x = 1.5; player.y = 1.5; player.angle = 0.5; player.partsCollected = 0;
    andy.x = 13.5; andy.y = 1.5;
    boatParts.forEach(p => p.collected = false);
    gameState = 'INTRO_CUTSCENE';
    cutsceneStage = 0;
    cutsceneTimer = 0;
    document.exitPointerLock();
}

function update() {
    if (gameState === 'INTRO_CUTSCENE') {
        cutsceneTimer++;
        if (cutsceneTimer > 180) { // Cycle text segments every ~3 seconds
            cutsceneTimer = 0;
            cutsceneStage++;
        }
        return;
    }

    if (gameState === 'OUTRO_CUTSCENE') {
        cutsceneTimer++;
        if (cutsceneTimer > 180) {
            cutsceneTimer = 0;
            cutsceneStage++;
        }
        return;
    }

    if (gameState === 'JUMPSCARE') {
        cutsceneTimer++;
        return;
    }

    if (gameState !== 'PLAYING') return;

    // Movement mechanics
    let moveX = 0, moveY = 0;
    if (keys['w']) { moveX += Math.cos(player.angle) * player.speed; moveY += Math.sin(player.angle) * player.speed; }
    if (keys['s']) { moveX -= Math.cos(player.angle) * player.speed; moveY -= Math.sin(player.angle) * player.speed; }
    if (keys['a']) { moveX += Math.sin(player.angle) * player.speed; moveY -= Math.cos(player.angle) * player.speed; }
    if (keys['d']) { moveX -= Math.sin(player.angle) * player.speed; moveY += Math.cos(player.angle) * player.speed; }

    let pY = Math.floor(player.y), pX = Math.floor(player.x);
    if (islandMap[pY][Math.floor(player.x + moveX)] !== 1) player.x += moveX;
    if (islandMap[Math.floor(player.y + moveY)][pX] !== 1) player.y += moveY;

    // Core mechanic: Item collection
    for (let part of boatParts) {
        if (!part.collected && Math.hypot(player.x - part.x, player.y - part.y) < 0.5) {
            part.collected = true;
            player.partsCollected++;
        }
    }

    // Escape zone logic
    if (islandMap[Math.floor(player.y)][Math.floor(player.x)] === 2) {
        if (player.partsCollected >= player.totalParts) {
            gameState = 'OUTRO_CUTSCENE';
            cutsceneStage = 0;
            cutsceneTimer = 0;
            document.exitPointerLock();
            return;
        }
    }

    // Hunter tracking AI
    let dx = player.x - andy.x, dy = player.y - andy.y;
    let distToAndy = Math.hypot(dx, dy);
    let currentAndySpeed = andy.speed + (player.partsCollected * 0.004); // Ramps speed up with each item found

    let angleToPlayer = Math.atan2(dy, dx);
    let nax = andy.x + Math.cos(angleToPlayer) * currentAndySpeed;
    let nay = andy.y + Math.sin(angleToPlayer) * currentAndySpeed;

    if (islandMap[Math.floor(andy.y)][Math.floor(nax)] !== 1) andy.x = nax;
    if (islandMap[Math.floor(nay)][Math.floor(andy.x)] !== 1) andy.y = nay;

    // Damage boundary
    if (distToAndy < 0.4) {
        gameState = 'JUMPSCARE';
        cutsceneTimer = 0;
        document.exitPointerLock();
    }
}

function draw() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    let statsEl = document.getElementById('stats');

    if (gameState === 'INTRO_CUTSCENE') {
        statsEl.innerText = "CLASSIFIED BRIEFING";
        ctx.fillStyle = '#051005'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#00ff66'; ctx.font = '16px Courier New'; ctx.textAlign = 'center';

        if (cutsceneStage === 0) {
            ctx.fillText("LOGISTICS REPORT: OPERATION ANDY'S ISLAND", canvas.width/2, 240);
            ctx.fillText("5 CIA agents deployed to track the anomaly.", canvas.width/2, 280);
        } else if (cutsceneStage === 1) {
            ctx.fillText("...4 ARE DEAD.", canvas.width/2, 240);
            ctx.fillText("The 5th agent managed to safely flee the perimeter.", canvas.width/2, 280);
        } else if (cutsceneStage === 2) {
            ctx.fillText("YOU ARE THE REINFORCEMENT OPERATIVE.", canvas.width/2, 220);
            ctx.fillText("Your drop pod landed, but your extraction transport broke down.", canvas.width/2, 260);
            ctx.fillText("Locate the 4 missing boat parts scattered around the thickets.", canvas.width/2, 300);
        } else {
            ctx.fillStyle = '#ffffff';
            ctx.fillText("MISSION OUTLINE: REPAIR BOAT & RUN AWAY", canvas.width/2, 240);
            ctx.fillStyle = '#33ff66';
            ctx.fillText("PRESS [SPACEBAR] TO SEARCH THE JUNGLE CORRIDORS", canvas.width/2, 340);
        }
        return;
    }

    if (gameState === 'OUTRO_CUTSCENE') {
        statsEl.innerText = "EXTRACTION SUCCESS";
        ctx.fillStyle = '#000511'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#00bbff'; ctx.font = '16px Courier New'; ctx.textAlign = 'center';

        if (cutsceneStage === 0) {
            ctx.fillText("The boat engine roars violently to life!", canvas.width/2, 240);
            ctx.fillText("You steer off the sandy banks into open water.", canvas.width/2, 280);
        } else if (cutsceneStage === 1) {
            ctx.fillText("Looking back at the misty island shore...", canvas.width/2, 240);
            ctx.fillText("A tall, lanky 6th-grade shadow watches you fade into the distance.", canvas.width/2, 280);
        } else {
            ctx.fillStyle = '#ffffff';
            ctx.fillText("YOU ESCAPED ANDY'S ISLAND!", canvas.width/2, 240);
            ctx.fillText("PRESS [SPACEBAR] TO RESET SIMULATION", canvas.width/2, 340);
        }
        return;
    }

    if (gameState === 'JUMPSCARE') {
        statsEl.innerText = "KIA";
        let flash = Math.floor(cutsceneTimer / 4) % 2 === 0;
        ctx.fillStyle = flash ? '#550000' : '#110000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#000000'; ctx.fillRect(200, 100, 400, 500);
        ctx.fillStyle = '#dfcbd0'; ctx.fillRect(300, 150, 200, 200); 
        ctx.fillStyle = flash ? '#ff0000' : '#ffffff';
        ctx.fillRect(340, 220, 30, 20); ctx.fillRect(430, 220, 30, 20); 

        ctx.fillStyle = '#ff1111'; ctx.font = 'bold 40px Courier New'; ctx.textAlign = 'center';
        ctx.fillText("ANDY CAUGHT YOU", canvas.width/2, 450);

        if (cutsceneTimer > 60) {
            ctx.fillStyle = '#ffffff'; ctx.font = '14px Courier New';
            ctx.fillText("PRESS [SPACEBAR] TO TRY RE-DEPLOYMENT", canvas.width/2, 520);
        }
        return;
    }

    // --- 3D ENGINE ENVIRONMENT RENDERING ---
    ctx.fillStyle = '#091a0c'; ctx.fillRect(0, 0, canvas.width, canvas.height / 2);
    ctx.fillStyle = '#1c1611'; ctx.fillRect(0, canvas.height / 2, canvas.width, canvas.height / 2);

    depthBuffer = [];
    const numRays = canvas.width;
    for (let i = 0; i < numRays; i++) {
        let rayAngle = (player.angle - player.fov / 2) + (i / numRays) * player.fov;
        let distanceToWall = 0; let hitWall = false; let hitType = 1;
        let eyeX = Math.cos(rayAngle), eyeY = Math.sin(rayAngle);

        while (!hitWall && distanceToWall < 16) {
            distanceToWall += 0.04;
            let checkX = Math.floor(player.x + eyeX * distanceToWall);
            let checkY = Math.floor(player.y + eyeY * distanceToWall);

            if (checkX < 0 || checkX >= MAP_SIZE || checkY < 0 || checkY >= MAP_SIZE) {
                hitWall = true; distanceToWall = 16;
            } else if (islandMap[checkY][checkX] === 1) {
                hitWall = true; hitType = 1;
            } else if (islandMap[checkY][checkX] === 2) {
                hitWall = true; hitType = 2;
            }
        }

        let correctedDist = distanceToWall * Math.cos(rayAngle - player.angle);
        depthBuffer.push(correctedDist);

        let ceiling = (canvas.height / 2) - (canvas.height / correctedDist);
        let floor = canvas.height - ceiling;
        let wallHeight = floor - ceiling;
        let brightness = Math.max(0, 1 - (correctedDist / 12));

        if (hitType === 2) {
            ctx.fillStyle = `rgba(180, 100, 40, ${brightness})`; 
        } else {
            ctx.fillStyle = `rgba(20, 75, 30, ${brightness})`; 
        }
        ctx.fillRect(i, ceiling, 1, wallHeight);

        if (hitType === 1 && i % 60 === 0) {
            ctx.fillStyle = `rgba(10, 40, 15, ${brightness * 1.3})`;
            ctx.fillRect(i, ceiling, 3, wallHeight);
        }
    }

    // --- SPRITE MANAGER ENGINE ---
    let sprites = [];
    boatParts.forEach(p => { if(!p.collected) sprites.push({x: p.x, y: p.y, type: 'part', label: p.type}); });
    sprites.push({x: andy.x, y: andy.y, type: 'andy'});

    sprites.sort((a, b) => Math.hypot(player.x - b.x, player.y - b.y) - Math.hypot(player.x - a.x, player.y - a.y));

    sprites.forEach(sprite => {
        let sx = sprite.x - player.x, sy = sprite.y - player.y;
        let spriteAngle = Math.atan2(sy, sx) - player.angle;
        while (spriteAngle < -Math.PI) spriteAngle += Math.PI * 2;
        while (spriteAngle > Math.PI) spriteAngle -= Math.PI * 2;

        let dist = Math.hypot(sx, sy);
        if (dist < 0.2 || Math.abs(spriteAngle) > player.fov) return;

        let spriteSize = Math.abs(canvas.height / dist);
        let alpha = Math.max(0, 1 - (dist / 12));

        if (sprite.type === 'andy') {
            let tallHeight = spriteSize * andy.heightModifier;
            let narrowWidth = spriteSize * andy.widthModifier;
            let tallScreenY = (canvas.height / 2) - (tallHeight / 1.6);
            let adjustedScreenX = (canvas.width / 2) + (Math.tan(spriteAngle) * (canvas.width / 2)) - (narrowWidth / 2);

            for (let col = 0; col < narrowWidth; col++) {
                let pixelX = Math.floor(adjustedScreenX + col);
                if (pixelX >= 0 && pixelX < canvas.width && depthBuffer[pixelX] > dist) {
                    ctx.fillStyle = `rgba(15, 20, 15, ${alpha})`; 
                    ctx.fillRect(pixelX, tallScreenY, 1, tallHeight);
                    ctx.fillStyle = `rgba(200, 180, 170, ${alpha})`; 
                    ctx.fillRect(adjustedScreenX + (narrowWidth * 0.35), tallScreenY + (tallHeight * 0.05), narrowWidth * 0.3, tallHeight * 0.12);
                    ctx.fillStyle = '#ff3333'; 
                    ctx.fillRect(adjustedScreenX + (narrowWidth * 0.42), tallScreenY + (tallHeight * 0.08), narrowWidth * 0.05, tallHeight * 0.02);
                    ctx.fillRect(adjustedScreenX + (narrowWidth * 0.53), tallScreenY + (tallHeight * 0.08), narrowWidth * 0.05, tallHeight * 0.02);
                }
            }
        } else {
            let spriteScreenX = (canvas.width / 2) + (Math.tan(spriteAngle) * (canvas.width / 2)) - (spriteSize / 4);
            let spriteScreenY = (canvas.height / 2) + (spriteSize * 0.1);
            let partWidth = spriteSize * 0.4;

            for (let col = 0; col < partWidth; col++) {
                let pixelX = Math.floor(spriteScreenX + col);
                if (pixelX >= 0 && pixelX < canvas.width && depthBuffer[pixelX] > dist) {
                    ctx.fillStyle = `rgba(255, 200, 0, ${alpha * 1.4})`; 
                    ctx.fillRect(pixelX, spriteScreenY, 1, spriteSize * 0.25);
                }
            }
        }
    });

    let shadowGrad = ctx.createRadialGradient(canvas.width / 2, canvas.height / 2, 40, canvas.width / 2, canvas.height / 2, 340);
    shadowGrad.addColorStop(0, 'rgba(0,0,0,0)'); shadowGrad.addColorStop(0.6, 'rgba(0,5,2,0.4)'); shadowGrad.addColorStop(1, 'rgba(0,0,0,0.98)');
    ctx.fillStyle = shadowGrad; ctx.fillRect(0, 0, canvas.width, canvas.height);

    let engineStatus = `Parts Secured: ${player.partsCollected}/${player.totalParts}`;
    if (player.partsCollected === player.totalParts) {
        engineStatus = `<span style="color:#33ff66; font-weight:bold;">ENGINE REPAIRED! GET TO THE STRANDED BOAT (SOUTH WALL)</span>`;
    }
    statsEl.innerHTML = `${engineStatus} | Stalking Distance: ${Math.round(Math.hypot(player.x - andy.x, player.y - andy.y))}m`;
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
